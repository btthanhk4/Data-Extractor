<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: Large dataset</title></head>
<body>
  <h1>Inventory (2,500 rows)</h1>
  <table id="inventory">
    <thead><tr><th>SKU</th><th>Product</th><th>Warehouse</th><th>Quantity</th><th>Unit price</th><th>Updated</th></tr></thead>
    <tbody></tbody>
  </table>
  <script>
    const tbody = document.querySelector('#inventory tbody');
    const frag = document.createDocumentFragment();
    const warehouses = ['Hanoi', 'Berlin', 'Austin', 'Osaka', 'Lagos'];
    for (let i = 1; i <= 2500; i++) {
      const tr = document.createElement('tr');
      const cells = [
        'SKU-' + String(i).padStart(5, '0'),
        'Widget model ' + i,
        warehouses[i % warehouses.length],
        String((i * 37) % 1000),
        '$' + ((i % 97) + 0.99).toFixed(2),
        '2026-0' + ((i % 9) + 1) + '-1' + (i % 10),
      ];
      for (const value of cells) {
        const td = document.createElement('td');
        td.textContent = value;
        tr.append(td);
      }
      frag.append(tr);
    }
    tbody.append(frag);
  </script>
</body>
</html>
